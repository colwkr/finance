<!doctype html>
<html lang="en" data-noir data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- full screen on the iPhone: the page runs under the status bar and to the rounded edges; app.css keeps the clock clear -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Finance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="base.css?v=4">
<link rel="stylesheet" href="finance.css?v=4">
<link rel="stylesheet" href="sections.css?v=4">
<link rel="stylesheet" href="noir.css?v=4">
<link rel="stylesheet" href="app.css?v=4">
<script src="wheels.js?v=4"></script>
<script src="finance.js?v=4"></script>
</head>
<body>
<div id="bg" aria-hidden="true"><div class="wall"></div></div>
<div class="app">
  <header class="fa-bar" id="bar" hidden>
    <button type="button" class="fa-menu" id="menuBtn" aria-controls="side" aria-expanded="false" aria-label="Menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M4.5 12h15M4.5 17h15"/></svg><span id="where"></span><em id="menuBadge" hidden></em></button>
  </header>
  <main id="view"></main>
</div>
<div class="fa-scrim" id="scrim" hidden></div>
<aside class="fa-side" id="side" aria-label="Sections" aria-hidden="true">
  <nav class="fa-nav" id="nav"></nav>
  <button type="button" class="fa-out" id="signOut"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4.5H7A1.5 1.5 0 0 0 5.5 6v12A1.5 1.5 0 0 0 7 19.5h7M10 12h9.5M16.5 9l3 3-3 3"/></svg><span>Sign out</span></button>
</aside>
<button type="button" class="fa-fab" id="addBtn" aria-label="Add" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js?v=4"></script>
</body>
</html>
